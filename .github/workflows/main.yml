name: Build and release

on: push

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Set up MSVC x86 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A Win32

    - name: Build Debug Executable
      run: |
        cmake --build build --config Debug

    - name: Build Release Executable
      run: |
        cmake --build build --config Release

    - name: Package Builds
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path builds
        
        # Locate and copy debug exe
        $dbg = Get-ChildItem -Path build -Filter "*.exe" -Recurse | Where-Object { $_.FullName -match "Debug" } | Select-Object -First 1
        if ($dbg) { 
            Copy-Item $dbg.FullName -Destination "builds/maniac-dbg.exe" 
            Write-Host "Found debug executable at: $($dbg.FullName)"
        } else {
            Write-Error "Could not find debug executable!"
        }

        # Locate and copy release exe
        $rel = Get-ChildItem -Path build -Filter "*.exe" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
        if ($rel) { 
            Copy-Item $rel.FullName -Destination "builds/maniac-prd.exe" 
            Write-Host "Found release executable at: $($rel.FullName)"
        } else {
            Write-Error "Could not find release executable!"
        }

    - name: Upload builds folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: builds
        path: builds
