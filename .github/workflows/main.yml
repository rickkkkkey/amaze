name: Build and release

on: push

jobs:
  build:
    name: Build for Windows
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Set up MSVC x86 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Debug Executable
      run: |
        cmake -B build-dbg -G "Ninja" -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-dbg

    - name: Build Release Executable
      run: |
        cmake -B build-rel -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        cmake --build build-rel

    - name: Package Builds
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path builds
        
        # Locate and copy debug exe
        $dbg = Get-ChildItem -Path build-dbg -Filter "*.exe" -Recurse | Select-Object -First 1
        if ($dbg) { 
            Copy-Item $dbg.FullName -Destination "builds/maniac-dbg.exe" 
            Write-Host "Found debug executable at: $($dbg.FullName)"
        }

        # Locate and copy release exe
        $rel = Get-ChildItem -Path build-rel -Filter "*.exe" -Recurse | Select-Object -First 1
        if ($rel) { 
            Copy-Item $rel.FullName -Destination "builds/maniac-prd.exe" 
            Write-Host "Found release executable at: $($rel.FullName)"
        }

    - name: Upload builds folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: builds
        path: builds
